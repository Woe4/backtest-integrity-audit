[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-integrity-audit"
version = "0.1.0"
description = "Tools for auditing backtest integrity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "yfinance>=0.2.65",
]

[project.scripts]
backtest-samples = "backtest_integrity_audit.samples:main"

[tool.setuptools.packages.find]
where = ["src"]
